name: Bug report
description: Report a reproducible problem with the June Oven integration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include pairing codes, tokens, passwords, signing seeds, oven IDs,
        private camera URLs, or unredacted Home Assistant backups.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.7.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or logs
      description: Use the integration diagnostics and check it again before posting.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, IDs, pairing material, and private camera URLs.
          required: true
        - label: I will state clearly if this was not verified on a physical oven.
          required: true
