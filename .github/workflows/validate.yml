name: Validate

on:
  pull_request:
  push:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Remove this after the integration has an accepted home-assistant/brands PR.
          ignore: brands

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol test dependency
        run: python -m pip install PyNaCl==1.6.2
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  home-assistant:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.1.0"
            python: "3.13"
          - homeassistant: "2026.7.3"
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant
        run: python -m pip install --pre "homeassistant==${{ matrix.homeassistant }}"
      - name: Exercise config flow
        run: >-
          python -m unittest discover -s tests
          -p "test_config_flow_compatibility.py" -v
