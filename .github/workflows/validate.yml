name: Validate

on:
  pull_request:
  push:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Workflows only need the repository contents. Pull requests never receive
# write-capable tokens.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Remove this after the integration has an accepted home-assistant/brands PR.
          ignore: brands

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyNaCl==1.6.2 ruff
      - name: Validate repository
        run: ./scripts/verify

  home-assistant:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.1.0"
            python: "3.13"
          - homeassistant: "2026.7.3"
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant
        run: python -m pip install --pre "homeassistant==${{ matrix.homeassistant }}"
      - name: Exercise config flow
        run: >-
          python -m unittest discover -s tests
          -p "test_config_flow_compatibility.py" -v
